<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Auto Moto Radar — Scegli la tua password</title>
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('amr_theme')||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
  <style>
    :root, :root[data-theme="light"] {
      --bg:#f3f4f6; --surface:#ffffff; --line:#d3d8de; --line2:#b6bdc7;
      --text:#14181f; --muted:#5b6472; --accent:#1f6feb; --neg:#c2362f; --neg-bg:#fbe9e9;
      --ok:#117a37; --ok-bg:#e1f3e8;
    }
    :root[data-theme="dark"] {
      --bg:#0d1117; --surface:#161b22; --line:#2a313c; --line2:#3a434f;
      --text:#e6edf3; --muted:#8b97a6; --accent:#4d9bff; --neg:#f0726a; --neg-bg:#2a1414;
      --ok:#56d364; --ok-bg:#11271a;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding:20px; }
    .card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line2);
      border-radius:8px; padding:26px 24px; box-shadow:0 16px 50px rgba(0,0,0,0.22); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .brand b { font-size:1.18rem; font-weight:800; letter-spacing:-0.02em; }
    h1 { font-size:1.02rem; margin:0 0 6px; }
    .claim { font-size:0.82rem; color:var(--muted); margin-bottom:18px; line-height:1.45; }
    label { display:block; font-size:0.82rem; font-weight:600; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; font-size:1rem; padding:11px 12px; border:1px solid var(--line);
      border-radius:5px; background:var(--surface); color:var(--text); }
    input:focus { outline:none; border-color:var(--accent); }
    button.submit { width:100%; margin-top:18px; font-size:1rem; font-weight:700; padding:12px; border:none;
      border-radius:5px; background:var(--accent); color:#fff; cursor:pointer; }
    button.submit:disabled { opacity:.55; cursor:default; }
    .msg { display:none; margin-top:14px; font-size:0.85rem; border-radius:5px; padding:9px 11px; line-height:1.4; }
    .msg.show { display:block; }
    .msg.err { color:var(--neg); background:var(--neg-bg); border:1px solid var(--neg); }
    .msg.ok  { color:var(--ok);  background:var(--ok-bg);  border:1px solid var(--ok); }
    .msg a { color:inherit; font-weight:700; }
    .nascosto { display:none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#1f6feb"/>
        <circle cx="16" cy="16" r="10" fill="none" stroke="#bfdbfe" stroke-width="1.8"/>
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="#bfdbfe" stroke-width="1.8"/>
        <circle cx="16" cy="16" r="1.8" fill="#bfdbfe"/>
      </svg>
      <b>Auto Moto Radar</b>
    </div>

    <h1 id="titolo">Controllo dell'invito…</h1>
    <div class="claim" id="sottotitolo">Un momento.</div>

    <form id="modulo" class="nascosto" autocomplete="off">
      <label for="pw">Scegli la tua password</label>
      <input type="password" id="pw" autocomplete="new-password" required />
      <label for="pw2">Riscrivila</label>
      <input type="password" id="pw2" autocomplete="new-password" required />
      <button type="submit" class="submit" id="vai">Crea il mio accesso</button>
    </form>

    <div class="msg" id="msg"></div>
  </main>

  <script>
    // IL TOKEN STA NEL FRAMMENTO, non nella query: il frammento non viene mandato al server e non
    // finisce nell'header Referer. Un link incollato in una chat viene scaricato dai server di
    // quel servizio per fabbricare l'anteprima — cosi' quello che scaricano e' questa pagina
    // vuota, non l'invito. Da qui in poi il token viaggia solo dentro il corpo di una POST.
    var token = '';
    try {
      var h = String(location.hash || '').replace(/^#/, '');
      token = new URLSearchParams(h).get('t') || '';
    } catch (e) { token = ''; }

    var titolo = document.getElementById('titolo');
    var sotto = document.getElementById('sottotitolo');
    var modulo = document.getElementById('modulo');
    var msg = document.getElementById('msg');
    var minimo = 8;

    function dillo(testo, tipo) {
      msg.textContent = testo;
      msg.className = 'msg show ' + (tipo || 'err');
    }
    function fuoriGioco(testo) {
      titolo.textContent = 'Questo link non vale';
      sotto.textContent = testo;
      modulo.classList.add('nascosto');
    }

    var MOTIVI = {
      'sconosciuto': 'Il link non risulta. Controlla di averlo copiato per intero, oppure chiedi che venga rifatto.',
      'gia-usato': 'Questo link e\' gia\' stato usato: l\'accesso esiste. Se non sei stato tu, dillo subito a chi te l\'ha mandato.',
      'scaduto': 'Il link e\' scaduto. Chiedi che venga rifatto: ne basta uno nuovo.'
    };

    function posta(percorso, dati) {
      return fetch(percorso, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dati)
      }).then(function (r) { return r.json().then(function (j) { return { stato: r.status, corpo: j }; }); });
    }

    if (!token) {
      fuoriGioco('Nell\'indirizzo non c\'e\' nessun invito. Il link finisce con #t= seguito da una lunga sigla.');
    } else {
      posta('/api/invito/chi', { token: token }).then(function (r) {
        if (!r.corpo || r.corpo.valido !== true) {
          return fuoriGioco((r.corpo && MOTIVI[r.corpo.motivo]) || (r.corpo && r.corpo.error) || 'Riprova piu\' tardi.');
        }
        minimo = r.corpo.minimo || 8;
        titolo.textContent = 'Ciao ' + r.corpo.nome;
        // textContent, mai innerHTML: il nome lo ha scritto una persona, non noi.
        sotto.textContent = 'La tua richiesta e\' stata approvata. Scegli qui la password con cui entrerai:'
          + ' almeno ' + minimo + ' caratteri. Nessuno la vedra\', nemmeno chi ti ha mandato il link.';
        modulo.classList.remove('nascosto');
        document.getElementById('pw').focus();
      }).catch(function () { fuoriGioco('Non riesco a parlare col server. Riprova fra poco.'); });
    }

    modulo.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pw = document.getElementById('pw').value;
      var pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) return dillo('Le due password non sono uguali.');
      if (pw.length < minimo) return dillo('Troppo corta: servono almeno ' + minimo + ' caratteri.');
      var vai = document.getElementById('vai');
      vai.disabled = true;
      posta('/api/invito', { token: token, password: pw }).then(function (r) {
        if (r.corpo && r.corpo.ok) {
          modulo.classList.add('nascosto');
          titolo.textContent = 'Fatto';
          sotto.textContent = 'Il tuo accesso e\' pronto.';
          msg.className = 'msg show ok';
          msg.textContent = '';
          var a = document.createElement('a');
          a.href = '/login'; a.textContent = 'Vai alla pagina di accesso';
          msg.appendChild(document.createTextNode('Entra con la password che hai appena scelto. '));
          msg.appendChild(a);
          return;
        }
        vai.disabled = false;
        dillo((r.corpo && r.corpo.error) || 'Non ha funzionato. Riprova.');
      }).catch(function () { vai.disabled = false; dillo('Non riesco a parlare col server. Riprova fra poco.'); });
    });
  </script>
</body>
</html>
